<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bing Link Harvester</title>
  <style>
    /* ---- Design tokens ---------------------------------------------------- */
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --border: #e3e6eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --warn-bg: #fef3c7;
      --warn-text: #92400e;
      --ok: #059669;
      --radius: 8px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --surface: #171a21;
        --border: #2a2f3a;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --warn-bg: #3a2a06;
        --warn-text: #fcd34d;
      }
    }

    /* ---- Layout ----------------------------------------------------------- */
    * { box-sizing: border-box; }
    body {
      width: 440px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    header h1 { flex: 1; }
    .icon-btn { flex: 0 0 auto; padding: 4px 10px; font-size: 12px; }
    h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
    .pill {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      padding: 2px 8px; border-radius: 999px; background: var(--border); color: var(--muted);
    }
    .pill[data-status="running"] { background: var(--accent); color: #fff; }
    .pill[data-status="paused"]  { background: var(--danger); color: #fff; }
    .pill[data-status="done"]    { background: var(--ok); color: #fff; }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
    }
    label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 6px; }
    label small { font-weight: 400; color: var(--muted); }

    textarea {
      width: 100%;
      resize: vertical;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font: 12px/1.5 var(--mono);
      white-space: pre;
      overflow-wrap: normal;
    }
    textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    #queries { height: 96px; }
    #results { height: 150px; }

    /* ---- Buttons ---------------------------------------------------------- */
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    button {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.danger { color: var(--danger); }
    [hidden] { display: none !important; }

    /* ---- Status ----------------------------------------------------------- */
    #status { margin: 0; font-weight: 500; }
    #status.warn { background: var(--warn-bg); color: var(--warn-text); padding: 8px; border-radius: 6px; }
    .progress { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: var(--accent); transition: width 0.3s ease; }
    details { margin-top: 8px; }
    summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    #log {
      margin: 6px 0 0; max-height: 110px; overflow: auto;
      font: 11px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap;
    }
    .hint { color: var(--muted); font-size: 11px; margin: 0; }

    /* ---- Options ---------------------------------------------------------- */
    .opt { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin: 6px 0 0; justify-content: flex-start; }
    .opt input { margin-top: 2px; }
    .opt span small { display: block; color: var(--muted); }
    .opt input[type="number"] {
      margin-left: auto; width: 64px; padding: 3px 6px; border-radius: 6px; font: inherit;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
    .opt select {
      margin-left: auto; padding: 3px 6px; border-radius: 6px; font: inherit;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }

    /* ---- Full-page mode (popup.html?full=1 opened in a tab) --------------- */
    body.full { width: auto; max-width: 1100px; margin: 0 auto; padding: 24px; }
    body.full .grid { display: grid; grid-template-columns: 380px 1fr; gap: 16px; align-items: start; }
    body.full #queries { height: 200px; }
    body.full #results { height: calc(100vh - 210px); min-height: 300px; }
    body.full #log { max-height: 260px; }
    body.full #fullBtn, body.full #keepOpenHint { display: none; }
    @media (max-width: 800px) { body.full .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Bing Link Harvester</h1>
    <span id="statusPill" class="pill" data-status="idle">idle</span>
    <button id="fullBtn" class="icon-btn" title="Open in a full browser tab (won't close when you click away)">⤢ Full page</button>
  </header>

  <div class="grid">
  <div>

  <!-- 1. Queries -->
  <section>
    <label for="queries">Bing queries <small>one per line</small></label>
    <textarea id="queries" spellcheck="false"
      placeholder='ip:23.227.38.65 loc:AU "garden" "free shipping"&#10;ip:23.227.38.65 site:com.au "bbq" reviews'></textarea>
    <div class="row">
      <button id="startBtn" class="primary">Start Harvest</button>
      <button id="stopBtn" class="danger" hidden>Stop</button>
      <button id="resumeBtn" class="primary" hidden title="Harvesting resumes by itself once the CAPTCHA is solved — use this if it doesn't">Resume now</button>
      <button id="showTabBtn" hidden>Show Bing tab</button>
    </div>
  </section>

  <!-- Options: keep results on-target -->
  <section>
    <details id="optionsBox" open>
      <summary>Options — keep results on-target</summary>
      <label class="opt">
        <input type="checkbox" id="optEnforceSite" checked />
        <span>Enforce <code>site:</code> operator
          <small>Drop results whose domain doesn't match site: / -site: in the query.</small></span>
      </label>
      <label class="opt">
        <input type="checkbox" id="optSkipRewritten" checked />
        <span>Skip query if Bing changes it
          <small>"Including results for…", "Did you mean…" — those results are off-topic.</small></span>
      </label>
      <label class="opt">
        <span>Bing market
          <small>Auto uses loc:XX from the query.</small></span>
        <select id="optMarket">
          <option value="auto">Auto (from loc:)</option>
          <option value="en-AU">Australia (en-AU)</option>
          <option value="en-US">United States (en-US)</option>
          <option value="en-GB">United Kingdom (en-GB)</option>
          <option value="en-CA">Canada (en-CA)</option>
          <option value="en-NZ">New Zealand (en-NZ)</option>
          <option value="none">Don't set</option>
        </select>
      </label>
      <label class="opt">
        <span>Delay between pages (seconds)
          <small>Randomised up to +60%. Higher = fewer CAPTCHAs. 5–8 recommended.</small></span>
        <input type="number" id="optDelay" min="2" max="60" step="1" value="5" />
      </label>
    </details>
  </section>

  <!-- 2. Status -->
  <section>
    <p id="status">Paste your queries and press Start Harvest.</p>
    <div class="progress"><div id="progressBar"></div></div>
    <details>
      <summary>Activity log</summary>
      <pre id="log"></pre>
    </details>
  </section>

  </div>
  <div>

  <!-- 3. Results -->
  <section>
    <label for="results">Collected URLs <small id="count">0 links</small></label>
    <textarea id="results" readonly spellcheck="false"></textarea>
    <div class="row">
      <button id="copyBtn" disabled>Copy All Links</button>
      <button id="csvBtn" disabled>Export CSV</button>
      <button id="clearBtn" class="danger" disabled>Clear</button>
    </div>
  </section>

  </div>
  </div>

  <p class="hint" id="keepOpenHint">Keep this popup open while harvesting — or click <b>⤢ Full page</b> so it can't close by accident.</p>

  <script src="popup.js"></script>
</body>
</html>
